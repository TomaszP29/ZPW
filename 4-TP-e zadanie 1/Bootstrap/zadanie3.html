<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="bg-warning">
        <div class="m-4 bg-primary text-white">m-4: odstęp NA ZEWNĄTRZ niebieskiego pola</div>
    </div>
    <div class="bg-warning">
        <div class="p-1 bg-primary text-white">p-1: odstęp WEWNĄTRZ niebieskiego pola</div>
    </div>

    <!-- mt-mb-3
    margin top - margin bottom - 3
    p-3
    padding - 3
    s - start (lewa, od początku tekstu)
    e - end (prawa, koniec tekstu)
    (brak) - wszystkie strony
    x - lewa i prawa
    y - góra i dół
    
    (odstęp margin/padding)(kierunek) - (opcjonalnie rozmiar ekranu np.sm,md,lg,xl,xxl) - (wartość) -->

    <!-- zadanie 1 
    Rozszyfruj klasy i zapisz ich znaczenie:
    pt-4 - padding top 3
    mx-2 - margin lewa prawa 2
    pb-0 - padding bottom brak
    me-3 - margin od prawej 3
    py-md-5 - padding góra dół 5 i rozmiar medium
    m-lg-auto - margin auto rozmiar large -->

    <!-- zadanie 2
    Napisz klasę dla opisu:
    margines dolny 4 - mb-4
    padding góra i dół 3 - py-3
    lewy margines 1 - ms-1
    padding ze wszystkich stron 5 - p-lg-5 -->

    <p class="mb-5">1</p>
    <p class="mb-5">2</p>
    <p class="mb-0">3</p>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
