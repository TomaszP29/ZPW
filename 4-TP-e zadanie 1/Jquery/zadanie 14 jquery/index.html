<html>
    <head>
        <title>Wprowadzenie jquery</title>
        <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

        <script>
            $(function(){
                $(document).keyup(function(e){
                    let napis = $("#szukaj").val().trim();

                    if(e.key == "Enter"){
                        if(napis.length == 0){
                            $("#wynik").text("Wpisz frazę!").css("color","red");
                        }else{
                            $("#wynik").text("Szukam: " + napis).css("color","black");
                        }
                    }

                    if(e.key == "Escape"){
                        $("#szukaj").val("");
                        $("#wynik").text("");
                    }
                });

                $(document).on("input",function(){
                    let dlugosc = $("#haslo").val().trim().length;

                    if(dlugosc < 6){
                        $("#sila").text("Słabe").css("background-color","red");
                    }else if(dlugosc > 6 && dlugosc < 9){
                        $("#sila").text("Średnie").css("background-color","orange");
                    }else if(dlugosc > 10){
                        $("#sila").text("Silne").css("background-color","green");
                    }
                });

                $("#logowanie").submit(function(e){
                    e.preventDefault();
                    if($("#login").val().length == 0){
                        $("#info").text("Podaj login").css("color","black");
                    }else if($("#pass").val().length < 6){
                        $("#info").text("Hasło za krótkie").css("color","black");
                    }else{
                        $("#info").text("Witaj " + $("#login").val() + "!").css("color","green");
                    }
                });

                $("#rozmiar").change(function(){
                    $("#tekst").text("Aktualny rozmiar: " + $(this).val() +" px").css("font-size",$(this).val());
                });

                $(".dodatek").on("change",function(){
                    let suma = 20;

                    $(".dodatek:checked").each(function(){
                        suma += Number($(this).val());
                    });

                    $("#suma").text(suma);
                });

                $("#akcept").on("change",function(){
                    $("#zamow").prop("disabled",!$(this).is(":checked"));
                });

                //Po kliknięciu sprawdź:
                // czy oba pola są wypełnione (trim()),
                // czy to liczby (isNaN),
                // czy waga mieści się w zakresie 20–300, a wzrost w zakresie 100–250.
                // Przy błędzie wypisz odpowiedni komunikat na czerwono. Jeśli wszystko jest w porządku, wylicz BMI (waga / (wzrost/100)²), zaokrąglij do 1 miejsca (toFixed(1)) i wypisz wynik.
                let waga = $("#waga").val().trim();
                let wzrost = $("#wzrost").val().trim() / 100;
                let bmi = waga / (wzrost * wzrost);
                $("#licz").click(function(){
                    if(isNaN(waga) && isNaN(wzrost) && waga > 20 && waga < 300 && wzrost > 100 && wzrost < 250){
                        $("#bmi").text("Twoje BMI = " + bmi).toFixed(1).css("color","black");
                    }else{
                        $("#bmi").text("Nieodpowiednie wartości").css("color","red");
                    }
                });
            });
        </script>
            
        <style>
            
        </style>
    </head>
    <body>
        <input type="text" id="szukaj" placeholder="Szukaj...">
        <p id="wynik"></p>

        <hr>

        <input type="password" id="haslo">
        <p id="sila"></p>

        <hr>

        <form id="logowanie">
        <input type="text" id="login" placeholder="Login">
        <input type="password" id="pass" placeholder="Hasło">
        <button type="submit">Zaloguj</button>
        </form>
        <p id="info"></p>

        <hr>

        <select id="rozmiar">
        <option value="14">Mały</option>
        <option value="20">Średni</option>
        <option value="28">Duży</option>
        </select>
        <p id="tekst">Przykładowy tekst akapitu.</p>

        <hr>

        <label><input type="checkbox" class="dodatek" value="3"> Ser (3 zł)</label>
        <label><input type="checkbox" class="dodatek" value="5"> Szynka (5 zł)</label>
        <label><input type="checkbox" class="dodatek" value="4"> Pieczarki (4 zł)</label>
        <p>Cena: <span id="suma">20</span> zł</p>
        <label><input type="checkbox" id="akcept"> Potwierdzam zamówienie</label>
        <button id="zamow" disabled>Zamów</button>

        <hr>

        <input type="text" id="waga" placeholder="Waga (kg)">
        <input type="text" id="wzrost" placeholder="Wzrost (cm)">
        <button id="licz">Oblicz</button>
        <p id="bmi"></p>
    </body>
</html>
