<html>
    <head>
        <title>Wprowadzenie jquery</title>
        <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

        <script>
            $(function(){
                $("#formularz").submit(function(e){
                    e.preventDefault()
                    if($("#nick").val() == ""){
                        $("#info").text("Podaj nick!");
                    }else{
                        $("#info").text("Wysłano!");
                    }
                });

                $("#login").submit(function(e){
                    e.preventDefault()
                    if($("#haslo").val().length < 6){
                        $("#co").text("Hasło jest za krótkie").css("color","red");
                    }else{
                        $("#co").text("Zalogowano").css("color","green");
                    }
                });

                $("#kolor").change(function(){
                    $("body").css("background-color",$(this).val());
                });

                $("#pizza").change(function(){
                    $("#jaka").text("Do zapłaty: " + $(this).val() + " zł");
                });
            });
        </script>
            
        <style>
            
        </style>
    </head>
    <body>
        <form id="formularz">
            <input type="text" id="nick">
            <button type="submit">Wyślij</button>
        </form>
        <p id="info"></p>

        <hr>

        <form id="login">
            <label>Email:</label>
            <input type="text" id="email">
            <label>Haslo:</label>
            <input type="text" id="haslo">
            <button type="submit">Wyślij</button>
        </form>
        <p id="co"></p>
        
        <hr>

        <select id="kolor">
            <option value="white">Biały</option>
            <option value="yellow">Żółty</option>
            <option value="lightblue">Niebieski</option>
        </select>

        <hr>

        <select id="pizza">
            <option value="20">Mała</option>
            <option value="30">Średnia</option>
            <option value="40">Duża</option>
        </select>
        <p id="jaka"></p>
    </body>
</html>
