<html>
    <head>
        <title>Wprowadzenie jquery</title>
        <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

        <script>
            $(function(){
                $(document).on("keydown keyup keypress", function(){
                     $("#eventType").text(event.type);
                });

                $(document).on("mousemove", function(){
                     $("#pageX").text(event.pageX);
                     $("#pageY").text(event.pageY);
                });

                $("#japko").css({
                    "margin-left":Math.floor((Math.random() * 100) + 1),
                    "margin-top":Math.floor((Math.random() * 100) + 1)
                });
                let positionX = 0;
                let positionY = 0;
                $(document).on("keydown", function(){
                    if(event.key == "d"){
                        positionX = positionX + 10;
                        $("#kwadrat").css("margin-left",positionX + "px");
                    }

                    if(event.key == "a"){
                        positionX = positionX - 10;
                        $("#kwadrat").css("margin-left",positionX + "px");
                    }

                    if(event.key == "w"){
                        positionY = positionY - 10;
                        $("#kwadrat").css("margin-top",positionY + "px");
                    }

                    if(event.key == "s"){
                        positionY = positionY + 10;
                        $("#kwadrat").css("margin-top",positionY + "px");
                    }
                });
            });
        </script>
            
        <style>
            #kwadrat{
                height: 200px;
                width: 200px;
                background-color: lightblue;
            }

            #japko{
                height: 20px;
                width: 20px;
                background-color: red;
            }
        </style>
    </head>
    <body>
        <input type="text" id="pole">

        <p>
            Typ zdarzenia:
            <span id="eventType">---</span>
        </p>

        <p>
            Pozycja myszy:
            X = <span id="pageX">---</span>
            Y = <span id="pageY">---</span>
        </p>

        <div id="kwadrat"></div>
        <div id="japko">.</div>
    </body>
</html>
